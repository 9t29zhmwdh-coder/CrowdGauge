[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crowdgauge"
version = "0.1.1"
description = "Venue busyness lookup: hourly footfall forecast and live occupancy from swappable data providers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["footfall", "busyness", "popular-times", "venue-analytics", "fastapi"]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.4", "respx>=0.21"]

[project.scripts]
crowdgauge = "crowdgauge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["crowdgauge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Calling Depends() and Query() in a parameter default is the documented FastAPI
# idiom, not the mutable default argument that B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
