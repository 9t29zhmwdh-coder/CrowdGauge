# CodeQL advanced setup.
#
# Replaces the repository default setup on purpose: default setup never runs on
# Dependabot pull requests, so the required "Analyze (...)" checks stayed absent
# and every Dependabot PR was blocked from merging. An explicit workflow runs on
# those pull requests as well and keeps the check names the branch ruleset pins.
#
# See engineering-standards/standards/ci-cd.md section 9.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Only what exceeds the workflow-level default of contents: read.
      # Repeating read grants here is what OpenSSF Scorecard flags as
      # excessive token permissions.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
